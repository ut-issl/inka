name: Evidence adapters

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Verify pytest evidence adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Build inka
        run: cargo build -p inka-cli --locked
      - name: Set up source-side pytest environment
        run: |
          python3 -m venv target/pytest-env
          target/pytest-env/bin/python -m pip install 'pytest>=8,<10'
      - name: Test real pytest integration
        env:
          INKA_BIN: ${{ github.workspace }}/target/debug/inka
        run: target/pytest-env/bin/python -m unittest discover -s adapters/pytest/tests -v

  vitest:
    name: Verify Vitest evidence adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build inka
        run: cargo build -p inka-cli --locked
      - name: Install adapter dependencies
        run: npm ci --prefix adapters/vitest --ignore-scripts
      - name: Test real Vitest integration
        env:
          INKA_BIN: ${{ github.workspace }}/target/debug/inka
        run: npm test --prefix adapters/vitest
