# Cut a release of every inka package. See RELEASING.md.
#
# Run it with workflow_dispatch from the Actions tab:
#
# * `mode: dry-run` (the default) runs every check, builds every release
#   asset and lists them in the run summary, from any branch, and creates
#   nothing. A tag that already exists or a missing CHANGELOG section is a
#   warning, so the build can be rehearsed on a branch that is not yet a
#   release.
# * `mode: release` (from main only) releases the version in Cargo.toml as
#   the tag `v<version>`: it builds every asset, creates the GitHub Release
#   (and with it the tag) on the dispatched commit with the CHANGELOG.md
#   section of that version as the body and the assets attached, and then
#   publishes the packages to crates.io, PyPI, npm, the VS Code Marketplace
#   and Open VSX. The GitHub Release exists before any registry is touched,
#   so a registry that refuses can be retried with "Re-run failed jobs".
#
# Release assets (<v> is the version, <target> a Rust target triple):
#
#   inka-<v>-<target>.tar.gz | .zip      inka, inka-lsp, inka-evidence-rust,
#                                         inka-evidence-merge
#   inka-vscode-<v>-<platform>.vsix      the VS Code extension with inka-lsp
#   inka_evidence-<v>-*.whl, .tar.gz     the Python package and its sdist
#   ut-issl-inka-evidence-<v>.tgz        the npm package
#   inka-web-<v>.tar.gz                  the graph viewer bundle for `inka serve`
#   SHA256SUMS                            checksums of every asset above
#
# Release builds never restore a cache: every asset is built from the
# dispatched commit and its lockfiles alone.

name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build only (dry-run) or release the version in Cargo.toml
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - release

permissions: {}

# Releases share one group, so two of them never create the same tag at
# once: a second one waits, then fails its tag check. GitHub keeps only one
# waiting run per group, so a third dispatch cancels the waiting one. Dry
# runs never wait.
#
# The workflow does not look at CI results: release only a commit of main
# whose CI has passed, which RELEASING.md's procedure guarantees.
concurrency:
  group: ${{ inputs.mode == 'release' && 'release' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:

  plan:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every package carries the workspace version
        run: python3 scripts/release.py check

      - name: Check the branch, the tag, and the release notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          # A release fails on these; a dry run only warns, so the build can
          # be rehearsed from a branch whose version is already released.
          problem() {
            if [ "${RELEASE_MODE}" = release ]; then
              echo "::error title=Release::$1"
              exit 1
            fi
            echo "::warning title=Release::$1 A release would fail here."
          }
          if [ "${RELEASE_MODE}" = release ] && [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error title=Release::Releases must be run from main, not ${GITHUB_REF}."
            exit 1
          fi
          version=$(python3 scripts/release.py version)
          tag="v${version}"
          # matching-refs matches by prefix, so keep only the exact tag.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
            --jq "[.[] | select(.ref == \"refs/tags/${tag}\")] | length")
          if [ "${existing}" != 0 ]; then
            problem "Tag ${tag} already exists; bump the version first."
          fi
          for changelog in CHANGELOG.md CHANGELOG.ja.md; do
            if ! python3 scripts/release.py notes "${version}" --changelog "${changelog}" \
                > "${RUNNER_TEMP}/${changelog}.notes" 2> "${RUNNER_TEMP}/${changelog}.error"; then
              problem "${changelog}: $(cat "${RUNNER_TEMP}/${changelog}.error")"
              echo "_No release notes for ${tag} in ${changelog}._" > "${RUNNER_TEMP}/${changelog}.notes"
            fi
          done
          {
            echo "# ${tag} (${RELEASE_MODE})"
            echo
            cat "${RUNNER_TEMP}/CHANGELOG.md.notes"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Define the binary targets
        id: targets
        # One row per platform the binaries and the VS Code extension ship
        # for. `vscode` is the extension's platform name for the same
        # machine; `ext` is the executable suffix.
        run: |
          targets=$(cat <<'JSON'
          [
            {"target": "x86_64-unknown-linux-musl",  "runner": "ubuntu-latest",    "archive": "tar.gz", "ext": "",     "vscode": "linux-x64"},
            {"target": "aarch64-unknown-linux-musl", "runner": "ubuntu-24.04-arm", "archive": "tar.gz", "ext": "",     "vscode": "linux-arm64"},
            {"target": "x86_64-apple-darwin",        "runner": "macos-latest",     "archive": "tar.gz", "ext": "",     "vscode": "darwin-x64"},
            {"target": "aarch64-apple-darwin",       "runner": "macos-latest",     "archive": "tar.gz", "ext": "",     "vscode": "darwin-arm64"},
            {"target": "x86_64-pc-windows-msvc",     "runner": "windows-latest",   "archive": "zip",    "ext": ".exe", "vscode": "win32-x64"}
          ]
          JSON
          )
          echo "targets=$(echo "${targets}" | jq -c .)" >> "${GITHUB_OUTPUT}"

  binaries:
    name: Build the binaries (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.targets) }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Install the musl linker
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build and archive the binaries
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          EXT: ${{ matrix.ext }}
        run: |
          cargo build --release --locked --target "${TARGET}" -p inka-cli -p inka-lsp -p inka-evidence-rust
          stage="inka-v${VERSION}-${TARGET}"
          mkdir -p "stage/${stage}" out server
          for bin in inka inka-lsp inka-evidence-rust inka-evidence-merge; do
            cp "target/${TARGET}/release/${bin}${EXT}" "stage/${stage}/"
          done
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "stage/${stage}/"
          if [ "${ARCHIVE}" = zip ]; then
            (cd stage && 7z a -tzip "../out/${stage}.zip" "${stage}" > /dev/null)
          else
            tar -C stage -czf "out/${stage}.tar.gz" "${stage}"
          fi
          # The VS Code extension bundles the server on its own.
          cp "target/${TARGET}/release/inka-lsp${EXT}" server/
          ls -l out server

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-binaries-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

      - name: Upload the language server for the VS Code extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intermediate-server-${{ matrix.target }}
          path: server/*
          if-no-files-found: error

  vscode:
    name: Package the VS Code extension (${{ matrix.vscode }})
    needs: [plan, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.targets) }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download the language server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intermediate-server-${{ matrix.target }}
          path: editors/vscode/server

      - name: Package the extension
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          VSCODE_TARGET: ${{ matrix.vscode }}
        working-directory: editors/vscode
        # The server travels inside the platform-specific .vsix; the
        # extension runs it from its own `server/` directory unless
        # `inka.serverPath` says otherwise. Artifacts lose file modes, so
        # the executable bit is restored here.
        run: |
          chmod +x server/*
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          npm ci
          mkdir -p ../../out
          npx vsce package --target "${VSCODE_TARGET}" \
            --out "../../out/inka-vscode-v${VERSION}-${VSCODE_TARGET}.vsix"
          npx vsce ls --tree

      - name: Upload the extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-vscode-${{ matrix.vscode }}
          path: out/*.vsix
          if-no-files-found: error

  wheels:
    name: Build the Python wheel (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The extension module is abi3 (Python 3.10 and later), so one
          # wheel per platform suffices. Linux wheels are built in maturin's
          # manylinux containers; aarch64 cross-compiles there.
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-latest, target: aarch64-unknown-linux-gnu}
          - {runner: macos-latest, target: x86_64-apple-darwin}
          - {runner: macos-latest, target: aarch64-apple-darwin}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Copy the license texts into the package
        shell: bash
        run: cp LICENSE-MIT LICENSE-APACHE crate/inka-evidence-py/

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist --manifest-path crate/inka-evidence-py/Cargo.toml

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build the Python sdist
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""

      - name: Copy the license texts into the package
        run: cp LICENSE-MIT LICENSE-APACHE crate/inka-evidence-py/

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path crate/inka-evidence-py/Cargo.toml

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  npm:
    name: Build the npm package
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        # rust-toolchain.toml adds the wasm32-unknown-unknown target.
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build and pack the package
        working-directory: crate/inka-evidence-wasm
        run: |
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          npm ci
          npm run build
          mkdir -p ../../out
          npm pack --pack-destination ../../out

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-npm
          path: out/*.tgz
          if-no-files-found: error

  web:
    name: Build the web viewer bundle
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build and archive the bundle
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        # `inka serve --assets <DIR>` takes the extracted directory.
        run: |
          (cd web && npm ci && npm run build)
          mkdir -p out
          tar -C web -czf "out/inka-web-v${VERSION}.tar.gz" \
            --transform "s,^dist,inka-web-v${VERSION}," dist

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-web
          path: out/*.tar.gz
          if-no-files-found: error

  assemble:
    name: Assemble the release assets
    needs: [plan, binaries, vscode, wheels, sdist, npm, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Download every asset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-*
          path: assets
          merge-multiple: true

      - name: Write the checksums and list the assets
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          {
            echo "## Assets of ${TAG}"
            echo
            echo "| Asset | Size |"
            echo "| --- | ---: |"
            for file in *; do
              echo "| ${file} | $(du -h "${file}" | cut -f1) |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
          cat SHA256SUMS

      - name: Upload the checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-checksums
          path: assets/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create the GitHub Release
    needs: [plan, assemble]
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # creates the tag and the GitHub Release
      id-token: write # signs the build provenance attestation
      attestations: write # stores the attestation

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every asset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-*
          path: assets
          merge-multiple: true

      - name: Attest the build provenance of the assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 scripts/release.py notes "${TAG#v}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest \
            assets/*

  # Every registry below is published with Trusted Publishing (OIDC) or a
  # token stored in the named environment; RELEASING.md lists the one-time
  # setup. The jobs are independent, so one registry refusing does not hold
  # back the others, and "Re-run failed jobs" retries only what failed.

  publish-crates-io:
    name: Publish to crates.io
    needs: [plan, release]
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/inka-cli
    permissions:
      contents: read
      id-token: write # Trusted Publishing exchanges the OIDC token for a crates.io token

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the crates
        # The binding crates (inka-evidence-py, inka-evidence-wasm) carry
        # `publish = false` and are skipped; they ship through PyPI and npm.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  publish-pypi:
    name: Publish to PyPI
    needs: [plan, release]
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/inka-evidence/
    permissions:
      id-token: write # Trusted Publishing exchanges the OIDC token for a PyPI token

    steps:
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-wheel-*
          path: dist
          merge-multiple: true

      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset-sdist
          path: dist

      - name: Publish the distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-npm:
    name: Publish to npm
    needs: [plan, release]
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ut-issl/inka-evidence
    permissions:
      contents: read
      id-token: write # Trusted Publishing exchanges the OIDC token for an npm token

    steps:
      - name: Set up Node.js
        # npm 11.5 or later publishes with the OIDC token of this job.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset-npm
          path: package

      - name: Publish the package
        run: |
          npm --version
          npm publish package/*.tgz --access public

  publish-vscode-marketplace:
    name: Publish to the VS Code Marketplace
    needs: [plan, release]
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=ut-issl.inka-vscode
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download the extensions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-vscode-*
          path: vsix
          merge-multiple: true

      - name: Publish the extensions
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: editors/vscode
        run: |
          npm ci
          npx vsce publish --skip-duplicate --packagePath ../../vsix/*.vsix

  publish-open-vsx:
    name: Publish to Open VSX
    needs: [plan, release]
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/ut-issl/inka-vscode
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download the extensions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-vscode-*
          path: vsix
          merge-multiple: true

      - name: Publish the extensions
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        working-directory: editors/vscode
        run: |
          npm ci
          npx ovsx publish --skip-duplicate --packagePath ../../vsix/*.vsix
