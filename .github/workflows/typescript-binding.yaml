name: TypeScript binding

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  determine-changes:
    name: Determine changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      binding: ${{ steps.changed-files.outputs.binding_any_changed }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          safe_output: false
          separator: "\n"
          files_yaml: |
            binding:
              - 'crate/inka-evidence/**'
              - 'crate/inka-evidence-wasm/**'
              - schemas/test-evidence-v1.schema.json
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .github/workflows/typescript-binding.yaml

  test:
    name: Test the TypeScript binding
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.binding == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crate/inka-evidence-wasm

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: crate/inka-evidence-wasm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the wasm package and run vitest
        run: npm test

      - name: Run tsc over the tests and the generated types
        run: npx tsc --noEmit

  collect:
    name: Collect TypeScript binding CI results
    needs: [determine-changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error title=TypeScript binding CI::At least one required job did not succeed."
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped."
