# site would be publicly visible even for a private repository).
# To re-enable when the repository becomes public:
#   1. Delete the placeholder `disabled` job below.
#   2. Restore the commented-out `on:`, `concurrency:`, `permissions:`, and
#      `jobs:` sections.
#   3. In Settings -> Pages, set "Build and deployment" source to
#      "GitHub Actions".
name: Documentation

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    name: Placeholder (deployment disabled while repository is private)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why this workflow does nothing
        run: echo "Documentation deployment is disabled while the repository is private."

