name: Documentation

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry-1.outputs.page_url || steps.deployment-retry-2.outputs.page_url || steps.deployment-retry-3.outputs.page_url }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build the English site
        run: uv run --locked zensical build --clean

      - name: Build the Japanese site
        run: uv run --locked zensical build --clean -f zensical.ja.toml

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # `deploy-pages` looks the artifact up once, right after the upload, and the artifact service may not list it for
      # several seconds (https://github.com/actions/deploy-pages/issues/451), which fails with `No artifacts named
      # "github-pages" were found`. Pages itself also fails a deployment now and then with `Deployment failed, try again
      # later`. Retry only the deployment: re-running the job uploads a second `github-pages` artifact, and the lookup
      # then fails because it finds two. Remove the retries once https://github.com/actions/deploy-pages/pull/455 is
      # released.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        continue-on-error: true

      - name: Wait before the first retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 5

      - name: Deploy to GitHub Pages (retry 1)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment-retry-1
        continue-on-error: true

      - name: Wait before the second retry
        if: steps.deployment-retry-1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 2)
        if: steps.deployment-retry-1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment-retry-2
        continue-on-error: true

      - name: Wait before the last retry
        if: steps.deployment-retry-2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 3)
        if: steps.deployment-retry-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment-retry-3
