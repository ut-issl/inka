name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  determine-changes:
    name: Determine changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.changed-files.outputs.rust_any_changed }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          safe_output: false
          separator: "\n"
          files_yaml: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - rust-toolchain.toml
              - deny.toml
              - 'tests/golden/**'
              - '**/*.inka'
              - '**/inka.toml'
              - .github/workflows/rust.yaml

  check:
    name: Check Rust code
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Run cargo check
        run: cargo check --workspace --all-targets --locked

  format:
    name: Check Rust format
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Run cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: Lint Rust code
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test Rust code
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Install cargo-nextest
        # The inka-evidence-rust integration tests drive real nextest runs.
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest

      - name: Run cargo test
        run: cargo test --workspace --locked

  inka-format:
    name: Check inka format
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Build inka
        run: cargo build -p inka-cli --locked

      - name: Run inka fmt --check on every project
        # Every directory holding an inka.toml is a project, fixtures
        # included; each is checked even after one fails, so a single run
        # lists every unformatted file.
        run: |
          status=0
          while IFS= read -r manifest; do
            ./target/debug/inka fmt --check "$(dirname "${manifest}")" || status=1
          done < <(git ls-files -- 'inka.toml' '*/inka.toml')
          exit "${status}"

  licenses:
    name: Check dependency licenses
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny

      - name: Run cargo deny
        # Every dependency's license must be on the allow list in deny.toml.
        run: cargo deny --locked check licenses

  collect:
    name: Collect Rust CI results
    needs: [determine-changes, check, format, clippy, test, inka-format, licenses]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error title=Rust CI::At least one required job did not succeed."
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped."
