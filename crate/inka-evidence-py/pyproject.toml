[project]
name = "inka-evidence"
version = "0.1.0"
description = "Emit inka test evidence v1 JSON from Python test adapters"
requires-python = ">=3.10"

[dependency-groups]
dev = [
  "jsonschema>=4",
  "pytest>=8",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "inka_evidence"
