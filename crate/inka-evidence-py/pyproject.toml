[project]
name = "inka-evidence"
version = "0.0.6"
description = "Emit inka test evidence v1 JSON from Python test adapters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
# The texts live at the repository root; the release workflow copies them
# here before building, so wheels and sdists carry them.
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Changelog = "https://github.com/ut-issl/inka/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ut-issl/inka/tree/main/crate/inka-evidence-py#readme"
Issues = "https://github.com/ut-issl/inka/issues"
Repository = "https://github.com/ut-issl/inka"

[project.scripts]
inka-evidence-merge = "inka_evidence.merge_cli:main"

# Registers the evidence plugin with every pytest in the environment; it
# stays inert unless --inka-evidence is passed.
[project.entry-points.pytest11]
inka_evidence = "inka_evidence.pytest_plugin"

[project.optional-dependencies]
# The pytest plugin only ever runs inside pytest; the extra documents the
# supported range without burdening plain emission users.
pytest = [
  "pytest>=8",
]

[dependency-groups]
dev = [
  "jsonschema>=4",
  "pytest>=8",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
# Mixed layout: the Rust extension is the private `_native` submodule and
# the package's Python source (re-exports and the pytest plugin) lives
# under python/.
module-name = "inka_evidence._native"
python-source = "python"
