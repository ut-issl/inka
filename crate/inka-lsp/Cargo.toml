[package]
name = "inka-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Language server for the inka argumentation DSL"
repository.workspace = true
license.workspace = true

# `cargo binstall` fetches the prebuilt archive of a GitHub Release instead
# of compiling; every binary of the workspace travels in the same archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/inka-v{ version }-{ target }{ archive-suffix }"
bin-dir = "inka-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
inka-core = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
