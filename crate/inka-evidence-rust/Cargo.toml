[package]
name = "inka-evidence-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust test adapter emitting inka test evidence from cargo-nextest runs"
repository.workspace = true
license.workspace = true

# `cargo binstall` fetches the prebuilt archive of a GitHub Release instead
# of compiling; every binary of the workspace travels in the same archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/inka-v{ version }-{ target }{ archive-suffix }"
bin-dir = "inka-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "inka-evidence-rust"
path = "src/main.rs"

[[bin]]
# Language-agnostic: merges evidence files from any adapter, shipped here
# so source repositories get it alongside the Rust adapter binary.
name = "inka-evidence-merge"
path = "src/bin/merge.rs"

[dependencies]
clap.workspace = true
inka-evidence.workspace = true
proc-macro2.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
