[package]
name = "inka-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for inka"
repository.workspace = true
license.workspace = true
# The viewer bundle is built, not committed, so the package must name it
# explicitly for `cargo publish` to carry it (see build.rs).
include = ["build.rs", "src/**", "web-dist/**"]

# `cargo binstall` fetches the prebuilt archive of a GitHub Release instead
# of compiling; every binary of the workspace travels in the same archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/inka-v{ version }-{ target }{ archive-suffix }"
bin-dir = "inka-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "inka"
path = "src/main.rs"

[dependencies]
ariadne = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
inka-core = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
