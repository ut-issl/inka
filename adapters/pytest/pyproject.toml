[project]
name = "inka-pytest"
version = "0.1.0"
description = "Source-side pytest evidence for inka"
requires-python = ">=3.10"
dependencies = ["pytest>=8,<10"]

[project.entry-points.pytest11]
inka = "inka_pytest"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["inka_pytest"]
