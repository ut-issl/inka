---
extends: default

rules:
  document-start:
    present: true
    ignore: |
      .github/workflows/*.yml
      .github/workflows/*.yaml
  truthy:
    ignore: |
      .github/workflows/*.yml
      .github/workflows/*.yaml
  comments:
    ignore: |
      .github/workflows/*.yml
      .github/workflows/*.yaml
  comments-indentation:
    ignore: |
      .github/workflows/*.yml
      .github/workflows/*.yaml
      .pre-commit-config.yaml
  line-length:
    max: 120
    # SHA-pinned `uses:` lines for reusable workflows exceed 120 characters
    ignore: |
      .github/workflows/*.yml
      .github/workflows/*.yaml
