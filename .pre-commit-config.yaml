---
default_stages: [pre-commit]

repos:
  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14  # frozen: v1.48.0
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 534166213006ec869b773b7ed8c6ebeaad1165d0  # frozen: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: fcb0ac886b00dd0305756b1e8466432e11601b5a  # frozen: v1.2.0
    hooks:
      - id: tombi-format
        exclude: (^|/)(Cargo|uv)\.lock$
      - id: tombi-lint
        exclude: (^|/)(Cargo|uv)\.lock$

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict", "-c=.yamllint.yaml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        # insta snapshots freeze renderer output verbatim, including any
        # trailing spaces ariadne emits; stripping them breaks the tests.
        exclude: '\.snap$'
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
        # web/fixtures/*.json is `inka export` output, kept byte-identical to
        # the command so regenerating it is an empty diff. The hook escapes
        # non-ASCII, which the exporter does not.
        exclude: '^web/fixtures/.*\.json$'
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        files: '\.rs$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$'
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --locked
        language: system
        files: '\.rs$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$'
        pass_filenames: false
        stages: [pre-push]

