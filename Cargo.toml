[workspace]
resolver = "3"
members = ["crate/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
ariadne = "0.6"
assert_cmd = "2"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
inka-core = { path = "crate/inka-core" }
inka-evidence = { path = "crate/inka-evidence" }
insta = "1"
js-sys = "0.3.106"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
predicates = "3"
proptest = "1"
pyo3 = { version = "0.30.1", features = ["abi3-py310", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
unicode-normalization = "0.1"
wasm-bindgen = "0.2.129"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
