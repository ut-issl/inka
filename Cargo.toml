[workspace]
resolver = "3"
members = ["crate/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
inka-core = { path = "crate/inka-core" }
thiserror = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
