# cargo-deny configuration: `cargo deny check licenses` in CI rejects any
# dependency whose license is not on this list, so a copyleft or unlicensed
# crate cannot slip into what inka (MIT OR Apache-2.0) ships.

[licenses]
# Only licenses that permit redistribution under MIT OR Apache-2.0 without
# adding obligations beyond keeping notices. A crate offering a choice
# (`MIT OR LGPL-2.1-or-later`) passes when any one option is listed here.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
